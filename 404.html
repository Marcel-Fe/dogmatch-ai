<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/dogmatch-ai/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="DogMatch AI - finde die perfekte Hunderasse mit KI-Beratung und Matching-Quiz.">
  <meta name="theme-color" content="#7C6BF0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DogMatch AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DogMatch AI</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Service-Worker-Auto-Update: bei jedem Page-Load auf neue Version pruefen
    und sofort aktivieren. Vermeidet, dass Nutzer Strg+Shift+R brauchen,
    nachdem ein neuer Build deployt wurde.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(function (registration) {
        try { registration.update(); } catch (e) { /* ignorieren */ }
      }).catch(function () { /* SW noch nicht registriert - ok */ });

      var reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloaded) return;
        reloaded = true;
        window.location.reload();
      });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
