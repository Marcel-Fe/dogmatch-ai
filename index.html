<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/dogmatch-ai/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="DogMatch AI - finde die perfekte Hunderasse mit KI-Beratung und Matching-Quiz.">
  <meta name="theme-color" content="#7C6BF0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DogMatch AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DogMatch AI</title>
  <link rel="manifest" href="manifest.json">

  <!-- Sofort sichtbarer Start-Bildschirm, damit der Nutzer nicht auf einen
       weissen Screen schaut, waehrend Flutter laedt. Wird entfernt, sobald
       die App ihren ersten Frame zeichnet. -->
  <style>
    #app-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #7C6BF0, #5A48C0);
      transition: opacity .35s ease; font-family: sans-serif;
    }
    #app-splash.hide { opacity: 0; pointer-events: none; }
    #app-splash .logo {
      color: #fff; font-size: 1.5rem; font-weight: 800;
      letter-spacing: .5px; margin-bottom: 1.25rem;
    }
    #app-splash .paw { font-size: 2.5rem; margin-bottom: .5rem; }
    #app-splash .spinner {
      width: 38px; height: 38px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,.35);
      border-top-color: #fff; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-splash">
    <div class="paw">🐾</div>
    <div class="logo">DogMatch AI</div>
    <div class="spinner"></div>
  </div>
  <script>
    // Splash ausblenden, sobald Flutter sein View-Element einhaengt.
    (function () {
      var splash = document.getElementById('app-splash');
      if (!splash) return;
      function hide() {
        splash.classList.add('hide');
        setTimeout(function () { splash.remove(); }, 400);
      }
      var obs = new MutationObserver(function () {
        if (document.querySelector('flutter-view, flt-glass-pane')) {
          obs.disconnect();
          // kurze Verzoegerung, damit der erste Frame wirklich gezeichnet ist
          setTimeout(hide, 200);
        }
      });
      obs.observe(document.body, { childList: true, subtree: true });
      // Sicherheits-Fallback: nach 12s in jedem Fall ausblenden.
      setTimeout(hide, 12000);
    })();
  </script>
  <!--
    Auto-Update: Der eigene Service-Worker (sw_swr.js, beim Deploy ueber
    flutter_service_worker.js kopiert) erkennt einen neuen Deploy und schickt
    "dm-reload". Dann laedt die App genau EINMAL automatisch neu - frisch und
    ohne manuelles Cache-Leeren. Eine Guard verhindert Endlosschleifen.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', function (ev) {
        if (ev.data === 'dm-reload' && !window.__dmReloaded) {
          window.__dmReloaded = true;
          window.location.reload();
        }
      });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
