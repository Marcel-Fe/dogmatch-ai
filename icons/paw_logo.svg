<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C6BF0"/>
      <stop offset="1" stop-color="#5B4BD6"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#shine)"/>

  <!-- Paw: 4 toes + main pad. Centered on (256, 296) for visual balance. -->
  <g fill="#FFFFFF" filter="url(#softShadow)">
    <!-- Toes (top, slightly tilted outward) -->
    <ellipse cx="156" cy="200" rx="40" ry="52" transform="rotate(-18 156 200)"/>
    <ellipse cx="218" cy="156" rx="40" ry="56" transform="rotate(-6 218 156)"/>
    <ellipse cx="294" cy="156" rx="40" ry="56" transform="rotate(6 294 156)"/>
    <ellipse cx="356" cy="200" rx="40" ry="52" transform="rotate(18 356 200)"/>

    <!-- Main pad (rounded "shield" shape) -->
    <path d="M256 268
             C 196 268 148 312 148 362
             C 148 410 196 444 256 444
             C 316 444 364 410 364 362
             C 364 312 316 268 256 268 Z"/>
  </g>
</svg>
